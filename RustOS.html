<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Desktop</title>
<style>
  :root {
    --taskbar-h: 44px;
    --accent: #2b6ecb;
    /* CUSTOM DESKTOP BACKGROUND: replace #000 with your own background, e.g.
       url('desktop-background.png') center / cover no-repeat; */
    --desktop-bg: url('Desktop bg.png');

    --dark-bg: #1e1e1e;
    --dark-panel: #252526;
    --dark-border: #3c3c3c;
    --dark-text: #d4d4d4;
    --dark-text-dim: #9d9d9d;
    --dark-hover: #2a2d2e;
    --dark-selected: #094771;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    width: 100%;
    overflow: hidden;
    font-family: "Segoe UI", Tahoma, Verdana, Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
  }

  #desktop {
    position: relative;
    height: calc(100% - var(--taskbar-h));
    width: 100%;
    background: var(--desktop-bg);
    overflow: hidden;
    user-select: none;
  }

  .icons {
    position: absolute;
    top: 18px;
    left: 18px;
    display: flex;
    flex-direction: column;
    gap: 22px;
  }

  .icon {
    width: 84px;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 8px 4px;
    border-radius: 3px;
    cursor: default;
    text-align: center;
  }

  .icon:hover .icon-glyph { filter: brightness(1.12); }

  .icon.selected {
    background: rgba(255,255,255,0.14);
    outline: 1px dashed rgba(255,255,255,0.55);
  }

  .icon-glyph {
    width: 42px;
    height: 42px;
    margin-bottom: 6px;
    pointer-events: none;
  }

  .icon-label {
    color: #fff;
    font-size: 12.5px;
    line-height: 1.25;
    text-shadow: 0 1px 2px rgba(0,0,0,0.75);
    pointer-events: none;
    max-width: 84px;
    word-wrap: break-word;
  }

  .window {
    position: absolute;
    min-width: 340px;
    min-height: 220px;
    border: 1px solid #000;
    box-shadow: 3px 3px 14px rgba(0,0,0,0.45);
    display: flex;
    flex-direction: column;
    overflow: hidden;
    background: var(--dark-bg);
  }

  .window.hidden { display: none; }

  .titlebar {
    height: 30px;
    background: linear-gradient(180deg, #3a3a3d 0%, #232326 100%);
    border-bottom: 1px solid #000;
    color: #f1f1f1;
    display: flex;
    align-items: center;
    padding: 0 4px 0 8px;
    font-size: 13px;
    font-weight: 600;
    flex-shrink: 0;
  }

  .titlebar .title-icon { width: 16px; height: 16px; margin-right: 6px; flex-shrink: 0; }

  .titlebar .title-text {
    flex: 1;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  .win-btn {
    width: 26px;
    height: 22px;
    border: 1px solid rgba(255,255,255,0.2);
    background: rgba(255,255,255,0.06);
    color: #eee;
    font-size: 12px;
    margin-left: 3px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: 2px;
  }

  .win-btn:hover { background: rgba(255,255,255,0.18); }
  .win-btn.close:hover { background: #e81123; border-color: #e81123; }

  .window-body {
    flex: 1;
    display: flex;
    overflow: hidden;
    background: var(--dark-bg);
  }

  /* ---------- Database window ---------- */
  .folder-sidebar {
    width: 180px;
    background: var(--dark-panel);
    border-right: 1px solid var(--dark-border);
    padding: 12px 0;
    flex-shrink: 0;
    overflow-y: auto;
  }

  .folder-sidebar .group-label {
    font-size: 11px;
    color: var(--dark-text-dim);
    padding: 4px 14px 8px;
    text-transform: uppercase;
    letter-spacing: 0.03em;
  }

  .folder-item {
    font-size: 13px;
    padding: 8px 14px;
    color: var(--dark-text);
    display: flex;
    align-items: center;
    gap: 9px;
    cursor: pointer;
  }

  .folder-item:hover { background: var(--dark-hover); }
  .folder-item.active { background: var(--dark-selected); color: #fff; }
  .folder-item svg { width: 20px; height: 16px; flex-shrink: 0; }

  .char-area {
    flex: 1;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  .char-empty {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--dark-text-dim);
    font-size: 13.5px;
    padding: 20px;
    text-align: center;
  }

  .char-panel {
    flex: 1;
    display: none;
    flex-direction: column;
    overflow: hidden;
  }

  .char-panel.active { display: flex; }

  .char-panel-header {
    padding: 10px 16px;
    border-bottom: 1px solid var(--dark-border);
    background: var(--dark-panel);
    flex-shrink: 0;
  }

  .char-panel-header h2 {
    margin: 0;
    font-size: 15px;
    color: #fff;
    font-weight: 600;
  }

  .char-content {
    flex: 1;
    display: flex;
    overflow: hidden;
  }

  .char-image-box {
    width: 220px;
    flex-shrink: 0;
    border-right: 1px solid var(--dark-border);
    background: var(--dark-panel);
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 18px 14px;
    gap: 10px;
    overflow-y: auto;
  }

  .char-image-frame {
    width: 170px;
    height: 170px;
    border-radius: 6px;
    background: var(--dark-bg);
    border: 1px solid var(--dark-border);
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
  }

  .char-image-frame img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: none;
  }

  .char-image-frame .placeholder-icon {
    width: 70px;
    height: 70px;
    color: #55565a;
  }

  .char-image-box button {
    font-size: 12px;
    padding: 6px 10px;
    background: #3a3a3c;
    border: 1px solid #4a4a4d;
    border-radius: 2px;
    color: var(--dark-text);
    cursor: pointer;
    width: 100%;
  }

  .char-image-box button:hover { background: #464648; }

  .char-image-filename {
    font-size: 11.5px;
    color: var(--dark-text-dim);
    text-align: center;
    word-break: break-word;
  }

  .char-text-box {
    flex: 1;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  .text-toolbar {
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 8px 12px;
    background: var(--dark-panel);
    border-bottom: 1px solid var(--dark-border);
    flex-shrink: 0;
    flex-wrap: wrap;
  }

  .text-toolbar button {
    font-size: 12px;
    padding: 5px 10px;
    background: #3a3a3c;
    border: 1px solid #4a4a4d;
    border-radius: 2px;
    color: var(--dark-text);
    cursor: pointer;
  }

  .text-toolbar button:hover:not(:disabled) { background: #464648; }
  .text-toolbar button:disabled { cursor: not-allowed; opacity: 0.45; }

  .text-toolbar button.refresh-btn {
    display: none;
    background: #5a3d1a;
    border-color: #7a5322;
  }

  .text-toolbar button.refresh-btn.visible { display: inline-block; }

  .text-filename {
    font-size: 12.5px;
    color: var(--dark-text-dim);
    margin-left: 4px;
    flex: 1;
    min-width: 80px;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  textarea.char-textarea {
    flex: 1;
    resize: none;
    border: none;
    outline: none;
    background: var(--dark-bg);
    color: var(--dark-text);
    font-family: "Cascadia Code", "Consolas", "Courier New", monospace;
    font-size: 13.5px;
    line-height: 1.6;
    padding: 16px;
  }

  textarea.char-textarea::placeholder { color: var(--dark-text-dim); }

  .status-bar {
    height: 22px;
    background: var(--dark-panel);
    border-top: 1px solid var(--dark-border);
    font-size: 11px;
    color: var(--dark-text-dim);
    display: flex;
    align-items: center;
    padding: 0 10px;
    flex-shrink: 0;
  }

  /* ---------- Taskbar ---------- */
  #taskbar {
    height: var(--taskbar-h);
    background: linear-gradient(180deg, #2a2a2a 0%, #101010 100%);
    border-top: 1px solid #000;
    display: flex;
    align-items: stretch;
    color: #fff;
    font-size: 13px;
  }

  #start-btn {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 0 16px;
    cursor: default;
    font-weight: 600;
    background: transparent;
  }

  #start-btn:hover { background: rgba(255,255,255,0.1); }
  #start-btn .start-logo { width: 20px; height: 20px; display: block; }

  .taskbar-divider {
    width: 1px;
    background: rgba(255,255,255,0.15);
    margin: 8px 4px;
  }

  #taskbar-items { display: flex; align-items: stretch; flex: 1; }

  .taskbar-item {
    display: flex;
    align-items: center;
    gap: 7px;
    padding: 0 14px;
    cursor: default;
    border-left: 1px solid rgba(255,255,255,0.08);
    background: rgba(255,255,255,0.06);
  }

  .taskbar-item.active {
    background: rgba(255,255,255,0.18);
    box-shadow: inset 0 -2px 0 var(--accent);
  }

  .taskbar-item img, .taskbar-item svg { width: 16px; height: 16px; flex-shrink: 0; }

  #clock {
    margin-left: auto;
    display: flex;
    align-items: center;
    padding: 0 16px;
    font-size: 12px;
    border-left: 1px solid rgba(255,255,255,0.15);
    white-space: nowrap;
  }

  /* ---------- Login / account UI ---------- */
  #login-screen { position: fixed; inset: 0; z-index: 99999; background: #000; display:flex; align-items:center; justify-content:center; }
  #login-card { width:340px; background:var(--dark-panel); border:1px solid #000; box-shadow:0 8px 30px rgba(0,0,0,.5); padding:24px; color:var(--dark-text); }
  #login-card h1 { margin:0 0 6px; color:#fff; font-size:22px; }
  #login-card p { margin:0 0 18px; color:var(--dark-text-dim); font-size:12px; }
  #login-card label { display:block; margin:10px 0 5px; font-size:12px; }
  #login-card input { width:100%; padding:9px; background:var(--dark-bg); color:#fff; border:1px solid var(--dark-border); outline:none; }
  .account-select { display:grid; grid-template-columns:1fr 1fr; gap:8px; margin:8px 0 12px; }
  .account-option { padding:10px; background:#303033; color:#ddd; border:1px solid #4a4a4d; cursor:pointer; text-align:left; }
  .account-option:hover { background:#3b3b3e; }
  .account-option.selected { background:#094771; border-color:#2b6ecb; color:#fff; }
  .account-option strong { display:block; font-size:13px; }
  .account-option span { display:block; margin-top:3px; font-size:10px; color:#aaa; }
  .account-option.selected span { color:#d6e8ff; }
  #login-btn { width:100%; margin-top:16px; padding:9px; border:1px solid #4a4a4d; background:#3a3a3c; color:#fff; cursor:pointer; }
  #login-btn:hover { background:#464648; }
  #login-error { min-height:16px; margin-top:10px; color:#ff7b7b; font-size:12px; }
  #account-area { margin-left:auto; display:flex; align-items:center; gap:8px; padding:0 12px; font-size:12px; }
  #logout-btn { padding:4px 8px; background:#3a3a3c; border:1px solid #4a4a4d; color:#ddd; cursor:pointer; }
  .readonly-note { color:#d7a85d; font-size:11px; margin-left:6px; }
  .upload-row { display:none; gap:6px; padding:8px 12px; background:var(--dark-panel); border-bottom:1px solid var(--dark-border); }
  .upload-row.visible { display:flex; }
  .upload-row button { font-size:12px; padding:5px 10px; background:#3a3a3c; border:1px solid #4a4a4d; color:var(--dark-text); cursor:pointer; }
  .upload-row input { font-size:12px; color:var(--dark-text); max-width:230px; }

</style>
</head>
<body>
<div id="login-screen">
  <form id="login-card">
    <h1>RustOS</h1><p>Sign in to access the Database.</p>
    <label>Account</label>
    <div class="account-select">
      <button type="button" class="account-option selected" data-account="Rust"><strong>Rust</strong><span>Editor</span></button>
      <button type="button" class="account-option" data-account="FG"><strong>FG</strong><span>Read only</span></button>
    </div>
    <input id="username" autocomplete="username" value="Rust" hidden required>
    <label for="password">Password</label><input id="password" type="password" autocomplete="current-password" required>
    <button id="login-btn" type="submit">Sign In</button>
    <div id="login-error"></div>
  </form>
</div>


<div id="desktop">

  <div class="icons">
    <div class="icon" id="icon-google" tabindex="0">
      <svg class="icon-glyph" viewBox="0 0 48 48">
        <circle cx="24" cy="24" r="20" fill="#fff"/>
        <path fill="#4285F4" d="M43.6 24.2c0-1.5-.1-3-.4-4.4H24v8.4h11c-.5 2.6-1.9 4.8-4.1 6.3v5.2h6.6c3.9-3.6 6.1-8.9 6.1-15.5z"/>
        <path fill="#34A853" d="M24 44c5.5 0 10.1-1.8 13.5-4.9l-6.6-5.2c-1.8 1.2-4.2 2-6.9 2-5.3 0-9.8-3.6-11.4-8.4H5.8v5.3C9.2 39.5 16 44 24 44z"/>
        <path fill="#FBBC05" d="M12.6 27.5c-.4-1.2-.6-2.5-.6-3.5s.2-2.3.6-3.5v-5.3H5.8C4.4 17.9 3.6 20.9 3.6 24s.8 6.1 2.2 8.8z"/>
        <path fill="#EA4335" d="M24 11.6c3 0 5.6 1 7.7 3l5.8-5.8C34.1 5.4 29.5 3.5 24 3.5c-8 0-14.8 4.5-18.2 11.2l6.8 5.3c1.6-4.8 6.1-8.4 11.4-8.4z"/>
      </svg>
      <div class="icon-label">Google</div>
    </div>

    <div class="icon" id="icon-database" tabindex="0">
      <svg class="icon-glyph" viewBox="0 0 48 48">
        <ellipse cx="24" cy="10" rx="16" ry="6" fill="#4fc3f7"/>
        <path fill="#29b6f6" d="M8 10v10c0 3.3 7.2 6 16 6s16-2.7 16-6V10c0 3.3-7.2 6-16 6S8 13.3 8 10z"/>
        <path fill="#039be5" d="M8 20v10c0 3.3 7.2 6 16 6s16-2.7 16-6V20c0 3.3-7.2 6-16 6S8 23.3 8 20z"/>
        <path fill="#0277bd" d="M8 30v6c0 3.3 7.2 6 16 6s16-2.7 16-6v-6c0 3.3-7.2 6-16 6S8 33.3 8 30z"/>
      </svg>
      <div class="icon-label">Database</div>
    </div>
  </div>

  <!-- Database Window -->
  <div class="window hidden" id="window-database" style="left: 160px; top: 70px; width: 760px; height: 480px;">
    <div class="titlebar">
      <svg class="title-icon" viewBox="0 0 48 48">
        <ellipse cx="24" cy="10" rx="16" ry="6" fill="#4fc3f7"/>
        <path fill="#29b6f6" d="M8 10v10c0 3.3 7.2 6 16 6s16-2.7 16-6V10c0 3.3-7.2 6-16 6S8 13.3 8 10z"/>
        <path fill="#039be5" d="M8 20v10c0 3.3 7.2 6 16 6s16-2.7 16-6V20c0 3.3-7.2 6-16 6S8 23.3 8 20z"/>
        <path fill="#0277bd" d="M8 30v6c0 3.3 7.2 6 16 6s16-2.7 16-6v-6c0 3.3-7.2 6-16 6S8 33.3 8 30z"/>
      </svg>
      <div class="title-text">Database</div>
      <div class="win-btn" data-action="minimize" data-target="database">&#x2013;</div>
      <div class="win-btn" data-action="maximize" data-target="database">&#x25a1;</div>
      <div class="win-btn close" data-action="close" data-target="database">&#x2715;</div>
    </div>
    <div class="window-body">
      <div class="folder-sidebar">
        <div class="group-label">Characters</div>
        <div class="folder-item" data-char="goku">
          <svg viewBox="0 0 40 32"><path fill="#5aa6e8" d="M2 6c0-1.1.9-2 2-2h11l3 4h18c1.1 0 2 .9 2 2v16c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2z"/></svg>
          Goku
        </div>
        <div class="folder-item" data-char="sonic">
          <svg viewBox="0 0 40 32"><path fill="#5aa6e8" d="M2 6c0-1.1.9-2 2-2h11l3 4h18c1.1 0 2 .9 2 2v16c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2z"/></svg>
          Sonic T. Hedgehog
        </div>
      </div>

      <div class="char-area">
        <div class="upload-row" id="upload-row"><button id="upload-text-btn">Upload Text</button><button id="upload-image-btn">Upload Image</button><input id="upload-file" type="file" hidden></div>
        <div class="char-empty" id="char-empty">Select a character folder on the left.</div>

        <!-- Goku panel -->
        <div class="char-panel" id="panel-goku">
          <div class="char-panel-header"><h2>Goku</h2></div>
          <div class="char-content">
            <div class="char-image-box">
              <div class="char-image-frame">
                <svg class="placeholder-icon" id="placeholder-goku" viewBox="0 0 24 24" fill="currentColor">
                  <path d="M12 12c2.7 0 5-2.3 5-5s-2.3-5-5-5-5 2.3-5 5 2.3 5 5 5zm0 2c-3.3 0-10 1.7-10 5v3h20v-3c0-3.3-6.7-5-10-5z"/>

                <img id="img-goku" alt="Goku">
              </div>
              <button id="choose-image-goku">Choose Image&hellip;</button>
              <div class="char-image-filename" id="image-filename-goku">No image selected</div>
            </div>
            <div class="char-text-box">
              <div class="text-toolbar">
                <button id="open-text-goku">Open Text File&hellip;</button>
                <button id="save-text-goku" disabled>Save</button>
                <button id="saveas-text-goku" disabled>Save As&hellip;</button>
                <button id="refresh-text-goku" class="refresh-btn">File changed &mdash; Reload</button>
                <span class="text-filename" id="filename-goku">No file open</span>
              </div>
              <textarea class="char-textarea" id="textarea-goku" placeholder="Open a .txt file about Goku. Edit it here, or edit it in Notepad and it'll refresh here automatically."></textarea>
            </div>
          </div>
        </div>

        <!-- Sonic panel -->
        <div class="char-panel" id="panel-sonic">
          <div class="char-panel-header"><h2>Sonic T. Hedgehog</h2></div>

              <div class="char-image-frame">
                <svg class="placeholder-icon" id="placeholder-sonic" viewBox="0 0 24 24" fill="currentColor">

                </svg>
                <img id="img-sonic" alt="Sonic">
              </div>
              <button id="choose-image-sonic">Choose Image&hellip;</button>
              <div class="char-image-filename" id="image-filename-sonic">No image selected</div>
            </div>
            <div class="char-text-box">
              <div class="text-toolbar">
                <button id="open-text-sonic">Open Text File&hellip;</button>
                <button id="save-text-sonic" disabled>Save</button>
                <button id="saveas-text-sonic" disabled>Save As&hellip;</button>
                <button id="refresh-text-sonic" class="refresh-btn">File changed &mdash; Reload</button>

      </div>
    </div>
    <div class="status-bar" id="db-statusbar">Ready</div>
  </div>

</div>

<div id="taskbar">
  <div id="start-btn">
    <!-- ==== CUSTOM LOGO ====
         Swap this SVG for your own icon. Two easy options:
         1) Edit the shapes below directly.
         2) Replace this whole <svg> with <img class="start-logo" src="your-logo.png" alt="Start">
    -->
    <svg class="start-logo" viewBox="0 0 24 24">
      <rect x="1" y="1" width="22" height="22" rx="5" fill="#3a3a3d"/>
      <circle cx="12" cy="12" r="6" fill="#8ab4f8"/>
    </svg>
  </div>
  <div class="taskbar-divider"></div>
  <div id="taskbar-items"></div>
  <div id="account-area"><span id="account-name"></span><button id="logout-btn">Log out</button></div>
  <div id="clock"></div>
</div>
<script src="config.js"></script>
<script>
const API_BASE=(window.RUSTOS_API_BASE||'').replace(/\/$/,'');
const desktop=document.getElementById('desktop'), taskbarItems=document.getElementById('taskbar-items'), icons=document.querySelectorAll('.icon');
const windows={database:{el:document.getElementById('window-database'),title:'Database',iconSVG:`<svg viewBox="0 0 48 48"><ellipse cx="24" cy="10" rx="16" ry="6" fill="#4fc3f7"/><path fill="#29b6f6" d="M8 10v10c0 3.3 7.2 6 16 6s16-2.7 16-6V10c0 3.3-7.2 6-16 6S8 13.3 8 10z"/><path fill="#039be5" d="M8 20v10c0 3.3 7.2 6 16 6s16-2.7 16-6V20c0 3.3-7.2 6-16 6S8 23.3 8 20z"/><path fill="#0277bd" d="M8 30v6c0 3.3 7.2 6 16 6s16-2.7 16-6v-6c0-3.3-7.2-6-16-6S8 33.3 8 30z"/></svg>`}};
let zCounter=10,maximizedState={}, currentUser=null, canEdit=false;
document.querySelectorAll('.account-option').forEach(b=>b.onclick=()=>{document.querySelectorAll('.account-option').forEach(x=>x.classList.remove('selected'));b.classList.add('selected');document.getElementById('username').value=b.dataset.account;document.getElementById('password').focus()});
const dbStatusbar=document.getElementById('db-statusbar');
function updateClock(){const n=new Date(),h=n.getHours()%12||12,m=String(n.getMinutes()).padStart(2,'0'),ap=n.getHours()>=12?'PM':'AM',d=n.toLocaleDateString(undefined,{month:'numeric',day:'numeric',year:'numeric'});document.getElementById('clock').innerHTML=`<div style="text-align:right"><div>${h}:${m} ${ap}</div><div style="font-size:10px;opacity:.8">${d}</div></div>`} updateClock();setInterval(updateClock,10000);
icons.forEach(i=>i.addEventListener('click',e=>{icons.forEach(x=>x.classList.remove('selected'));i.classList.add('selected');e.stopPropagation()}));desktop.addEventListener('click',()=>icons.forEach(i=>i.classList.remove('selected')));
function bringToFront(id){windows[id].el.style.zIndex=++zCounter} function openWindow(id){windows[id].el.classList.remove('hidden');bringToFront(id);renderTaskbar()} function closeWindow(id){windows[id].el.classList.add('hidden');renderTaskbar()} function minimizeWindow(id){closeWindow(id)}
function toggleMaximize(id){const w=windows[id].el;if(!maximizedState[id]){maximizedState[id]={left:w.style.left,top:w.style.top,width:w.style.width,height:w.style.height};Object.assign(w.style,{left:'0px',top:'0px',width:'100%',height:'100%'})}else{Object.assign(w.style,maximizedState[id]);maximizedState[id]=null}}
function renderTaskbar(){taskbarItems.innerHTML='';Object.keys(windows).forEach(id=>{if(!windows[id].el.classList.contains('hidden')){const x=document.createElement('div');x.className='taskbar-item active';x.innerHTML=`${windows[id].iconSVG}<span>${windows[id].title}</span>`;x.onclick=()=>bringToFront(id);taskbarItems.appendChild(x)}})}
document.getElementById('icon-database').ondblclick=()=>openWindow('database');document.getElementById('icon-database').onkeydown=e=>{if(e.key==='Enter')openWindow('database')};document.getElementById('icon-google').ondblclick=()=>window.open('https://www.google.com','_blank');document.getElementById('icon-google').onkeydown=e=>{if(e.key==='Enter')window.open('https://www.google.com','_blank')};
document.querySelectorAll('.win-btn').forEach(b=>b.onclick=e=>{e.stopPropagation();const a=b.dataset.action,id=b.dataset.target;if(a==='close'||a==='minimize')closeWindow(id);else if(a==='maximize')toggleMaximize(id)});
Object.keys(windows).forEach(id=>{const w=windows[id].el,t=w.querySelector('.titlebar');let drag=false,ox=0,oy=0;t.onmousedown=e=>{if(e.target.classList.contains('win-btn')||maximizedState[id])return;drag=true;const r=w.getBoundingClientRect();ox=e.clientX-r.left;oy=e.clientY-r.top;bringToFront(id)};document.addEventListener('mousemove',e=>{if(!drag)return;const r=desktop.getBoundingClientRect();w.style.left=Math.max(0,Math.min(e.clientX-ox,r.width-60))+'px';w.style.top=Math.max(0,Math.min(e.clientY-oy,r.height-30))+'px'});document.addEventListener('mouseup',()=>drag=false);w.onmousedown=()=>bringToFront(id)});
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
async function api(url,opt={}){
  const target=(API_BASE+url);
  let r;
  try {
    const headers=new Headers(opt.headers||{});
    const token=localStorage.getItem('rustos_token');
    if(token) headers.set('Authorization','Bearer '+token);
    r=await fetch(target,{...opt,headers});
  } catch(e){ throw new Error('Cannot reach the RustOS backend. Check the server/online backend address.'); }
  const type=r.headers.get('content-type')||'';
  let d=type.includes('application/json')?await r.json():await r.text();
  if(!r.ok){ const msg=(d&&d.error)||'Request failed'; throw new Error(msg); }
  return d;
}
function fileUrl(key,name){return API_BASE+'/api/files/'+encodeURIComponent(key)+'/'+encodeURIComponent(name)}
async function loadCharacter(key){const d=await api('/api/files?character='+encodeURIComponent(key));const ta=document.getElementById('textarea-'+key),fn=document.getElementById('filename-'+key),img=document.getElementById('img-'+key),ph=document.getElementById('placeholder-'+key),il=document.getElementById('image-filename-'+key);const text=d.files.find(f=>/\.(txt|md|log|csv)$/i.test(f.name));const image=d.files.find(f=>/^image\//.test(f.mime));if(text){const t=await api('/api/files/'+encodeURIComponent(key)+'/'+encodeURIComponent(text.name));ta.value=t;fn.textContent=text.name}else{ta.value='';fn.textContent='No text file uploaded'}if(image){img.src=fileUrl(key,image.name);img.style.display='block';ph.style.display='none';il.textContent=image.name}else{img.removeAttribute('src');img.style.display='none';ph.style.display='block';il.textContent='No image selected'}document.getElementById('save-text-'+key).disabled=!canEdit||!text;document.getElementById('saveas-text-'+key).disabled=!canEdit;document.getElementById('open-text-'+key).disabled=false;dbStatusbar.textContent=`${d.files.length} file(s) in ${key}`}
const folderItems=document.querySelectorAll('.folder-item');const charEmpty=document.getElementById('char-empty');folderItems.forEach(item=>item.onclick=async()=>{folderItems.forEach(i=>i.classList.remove('active'));item.classList.add('active');const key=item.dataset.char;document.querySelectorAll('.char-panel').forEach(p=>p.classList.remove('active'));document.getElementById('panel-'+key).classList.add('active');charEmpty.style.display='none';try{await loadCharacter(key)}catch(e){dbStatusbar.textContent=e.message}});
['goku','sonic'].forEach(key=>{const ta=document.getElementById('textarea-'+key);ta.oninput=()=>{document.getElementById('save-text-'+key).disabled=!canEdit};document.getElementById('save-text-'+key).onclick=async()=>{if(!canEdit)return;const name=document.getElementById('filename-'+key).textContent;if(!name||name==='No text file uploaded')return;try{await api('/api/files/'+encodeURIComponent(key)+'/'+encodeURIComponent(name),{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({content:ta.value})});dbStatusbar.textContent='Saved '+name}catch(e){dbStatusbar.textContent='Save failed: '+e.message}};document.getElementById('saveas-text-'+key).onclick=()=>{if(!canEdit)return;document.getElementById('upload-text-btn').click()};document.getElementById('open-text-'+key).onclick=()=>loadCharacter(key)});
let uploadMode='text',uploadKey=null;document.getElementById('upload-text-btn').onclick=()=>{if(!canEdit)return;uploadMode='text';document.getElementById('upload-file').accept='.txt,.md,.log,.csv';document.getElementById('upload-file').click()};document.getElementById('upload-image-btn').onclick=()=>{if(!canEdit)return;uploadMode='image';document.getElementById('upload-file').accept='image/*';document.getElementById('upload-file').click()};document.getElementById('upload-file').onchange=async()=>{const f=document.getElementById('upload-file').files[0],active=document.querySelector('.folder-item.active');if(!f||!active)return;uploadKey=active.dataset.char;const fd=new FormData();fd.append('file',f);try{await api('/api/files/'+encodeURIComponent(uploadKey),{method:'POST',body:fd});dbStatusbar.textContent='Uploaded '+f.name;await loadCharacter(uploadKey)}catch(e){dbStatusbar.textContent='Upload failed: '+e.message}document.getElementById('upload-file').value=''};
async function setUser(){try{const u=await api('/api/me');currentUser=u.user;canEdit=u.role==='editor';document.getElementById('login-screen').style.display='none';document.getElementById('account-name').textContent=`${u.user} (${u.role==='editor'?'Editor':'Read only'})`;document.getElementById('upload-row').classList.toggle('visible',canEdit);['goku','sonic'].forEach(k=>{document.getElementById('textarea-'+k).readOnly=!canEdit;document.getElementById('save-text-'+k).disabled=!canEdit;document.getElementById('saveas-text-'+k).disabled=!canEdit;});}catch{document.getElementById('login-screen').style.display='flex'}}
document.getElementById('login-card').onsubmit=async e=>{e.preventDefault();const err=document.getElementById('login-error');err.textContent='';try{const login=await api('/api/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:document.getElementById('username').value,password:document.getElementById('password').value})});localStorage.setItem('rustos_token',login.token);document.getElementById('password').value='';await setUser()}catch(x){err.textContent=x.message}};document.getElementById('logout-btn').onclick=async()=>{try{await api('/api/logout',{method:'POST'})}finally{localStorage.removeItem('rustos_token');location.reload()}};setUser();
</script>
