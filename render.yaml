services:
  - type: web
    name: rustos-backend
    runtime: node
    plan: starter
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: NODE_ENV
        value: production
      - key: FRONTEND_ORIGIN
        sync: false
      - key: RUST_PASSWORD
        sync: false
      - key: FG_PASSWORD
        sync: false
      - key: DATA_DIR
        value: /var/data/rustos
    disk:
      name: rustos-data
      mountPath: /var/data
      sizeGB: 1
