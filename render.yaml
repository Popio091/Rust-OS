services:
  - type: web
    name: rustos-backend
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: NODE_ENV
        value: production
      - key: FRONTEND_ORIGIN
        sync: false
      - key: RUST_PASSWORD
        sync: false
      - key: FG_PASSWORD
        sync: false
      - key: GITHUB_TOKEN
        sync: false
      - key: GITHUB_OWNER
        value: popio091
      - key: GITHUB_REPO
        value: Rust-OS
      - key: GITHUB_BRANCH
        value: rustos-data
      - key: GITHUB_BASE_BRANCH
        value: main
      - key: GITHUB_PATH_PREFIX
        value: RustOS/rustos-data
